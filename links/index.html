<style>
  :root {
    --orange: #FF8F1C;
    --blue: #8DB9CA;
    --yellow: #FFD451;
    --cream: #F5EFE4;
    --ink: #1A1714;
    --paper: #FAFAF7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter Tight', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.25rem 2rem;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -20%; right: -30%;
    width: 80vw; height: 80vw;
    background: radial-gradient(circle, var(--orange) 0%, transparent 70%);
    opacity: 0.18;
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
  }
  .wrap {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 20px 40px -15px rgba(26, 23, 20, 0.3);
    margin-bottom: 1.25rem;
  }
  .name {
    font-family: "dejanire-headline", 'Fraunces', serif;
    font-weight: 900;
    font-size: 2.25rem;
    letter-spacing: -0.02em;
    line-height: 0.95;
    margin-bottom: 0.25rem;
  }
  .handle {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    opacity: 0.55;
    margin-bottom: 0.75rem;
  }
  .tagline {
    font-family: "bettoni-variable", 'Fraunces', serif;
    font-variation-settings: 'opsz' 40, 'wght' 110;
    font-size: 1.15rem;
    line-height: 1.4;
    text-align: center;
    max-width: 340px;
    opacity: 0.85;
    margin-bottom: 2.5rem;
  }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 1.15rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 12px -6px rgba(26, 23, 20, 0.15);
    position: relative;
  }
  .link svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .link.has-thumb {
    padding: 1.25rem 5.25rem;
    line-height: 1.3;
    min-height: 4.5rem;
  }
  #latest-posts { display: contents; }
  .link-thumb {
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    height: calc(100% - 12px);
    aspect-ratio: 1 / 1;
    border-radius: 999px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .link:hover, .link:active {
    background: var(--ink);
    color: var(--paper);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -10px rgba(26, 23, 20, 0.4);
  }
  .link.primary {
    background: var(--orange);
    color: var(--paper);
    border-color: var(--orange);
  }

    background: var(--ink);

  .lk-social a:hover { background: var(--ink); color: var(--paper); }
  .lk-social svg { width: 18px; height: 18px; fill: currentColor; }
  .lk-search { position: relative; margin: 0 0.25rem 0.4rem; }
  .lk-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; fill: none; stroke: var(--ink); stroke-width: 2; opacity: .5; }
  .lk-search input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem; border: 1px solid rgba(26,23,20,.25); border-radius: 999px; background: #fff; font: inherit; font-size: 16px; color: var(--ink); }
  .lk-search input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,143,28,.15); }
  .lk-hint { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.18em; opacity: 0.5; margin: 0.9rem 0.25rem 0.6rem; }
  .lk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  @media (min-width: 600px) { .lk-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
  .lk-tile { position: relative; display: block; aspect-ratio: 1; overflow: hidden; border-radius: 6px; background: var(--cream); }
  .lk-tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .lk-tile:hover img { transform: scale(1.05); }
  .lk-tile span { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.6rem 0.6rem 0.55rem; background: linear-gradient(transparent, rgba(26,23,20,.82)); color: #fff; font-size: 0.82rem; font-weight: 600; line-height: 1.2; }
  .lk-more { display: block; margin: 1rem auto 0; padding: 0.75rem 1.6rem; border: 1px solid var(--ink); border-radius: 999px; background: transparent; font: inherit; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; color: var(--ink); }
  .lk-more:hover { background: var(--ink); color: var(--paper); }
  .lk-empty { text-align: center; opacity: .6; margin-top: 1rem; }
  .lk-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 1.8rem; }

  .lk-pills a:hover { background: var(--orange); }
  .footer { margin-top: 1.5rem; }

<script>
/* Newest blog posts first, as a tap-to-open photo grid. */
(function () {
  var grid = document.getElementById('lkGrid');
  var more = document.getElementById('lkMore');
  var empty = document.getElementById('lkEmpty');
  var search = document.getElementById('lkSearch');
  var PAGE = 24, shown = PAGE, all = [];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function thumb(image) {
    if (!image) return '/about-480w.jpg';
    var dot = image.lastIndexOf('.');
    var base = image.substring(0, dot).replace(/-(480|800|1200)w$/, '');
    return '/blog/images/' + base + '-480w' + image.substring(dot);
  }
  function render() {
    var q = search.value.trim().toLowerCase();
    var list = q ? all.filter(function (p) {
      return (p.title + ' ' + (p.excerpt || '') + ' ' + (p.tags || []).join(' ')).toLowerCase().indexOf(q) !== -1;
    }) : all;
    var page = q ? list : list.slice(0, shown);
    grid.innerHTML = page.map(function (p) {
      return '<a class="lk-tile" href="/blog/' + encodeURIComponent(p.slug) + '">' +
        '<img src="' + thumb(p.image) + '" alt="" loading="lazy" decoding="async" onerror="this.src=\'/about-480w.jpg\'">' +
        '<span>' + esc(p.shortTitle || p.title) + '</span></a>';
    }).join('');
    more.hidden = !!q || list.length <= shown;
    empty.hidden = list.length > 0;
  }
  more.addEventListener('click', function () { shown += PAGE; render(); });
  search.addEventListener('input', render);
  fetch('/blog/posts.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (posts) {
      all = posts.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      render();
    })
    .catch(function () { grid.innerHTML = '<a class="lk-pill-fallback" href="/blog/">See all recipes &rarr;</a>'; });
})();
</script>
